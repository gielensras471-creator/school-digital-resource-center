<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V0.1｜校园数字教学资源中心 · 移动端低保真原型</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#28313b;background:#f3f5f8}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #1f6fd1;outline-offset:2px}.workspace{max-width:1140px;margin:auto;padding:24px}.intro{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.intro h1{font-size:23px;margin:0 0 6px}.intro p{font-size:14px;color:#677485;line-height:1.7;margin:0}.flag{border:1px solid #dccd9a;border-radius:8px;background:#fff8df;padding:9px 13px;font-size:12px;color:#74621b;white-space:nowrap}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);align-items:start;gap:24px}.sidebar{border:1px solid #dfe3e8;background:white;border-radius:16px;padding:18px;box-shadow:0 8px 28px #2034470a}.sidebar h2{font-size:16px;margin:2px 0 15px}.scene{display:flex;align-items:center;width:100%;text-align:left;gap:12px;border:1px solid transparent;border-radius:10px;padding:13px 11px;background:transparent;color:#3c4b5b;margin:3px 0}.scene b{font-size:13px}.scene small{display:block;color:#798492;font-size:11px;margin-top:2px}.scene.active{background:#e9f1fb;border-color:#bcd6f4;color:#195991}.scene .num{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#e8ecf1;font-weight:800;font-size:12px;flex-shrink:0}.scene.active .num{background:#2474c3;color:white}.sidebar hr{border:0;border-top:1px solid #e7e9eb;margin:20px 0}.sidebar h3{font-size:13px;margin:0 0 9px}.sidebar .simulation{background:#fff;border:1px dashed #aab6c4;padding:12px;border-radius:9px;font-size:12px;width:100%;text-align:left;margin:5px 0;color:#2d526f}.sidebar .note{font-size:12px;line-height:1.85;color:#6d7682;margin:15px 0 0}.stage{background:#e8edf2;border:1px solid #dae1e7;border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:700px}.stage-meta{font-size:13px;font-weight:650;color:#536170}.device{width:375px;max-width:100%;height:750px;min-height:0;border:8px solid #25323f;border-radius:38px;background:#fff;box-shadow:0 18px 42px #19263325;overflow:hidden;position:relative}.phone-top{height:27px;background:#fff;position:relative}.notch{width:105px;height:18px;background:#25323f;border-radius:0 0 16px 16px;position:absolute;top:0;left:50%;transform:translateX(-50%)}.viewport{height:calc(100% - 27px);min-height:0;overflow-y:auto;background:#fbfcfd}.head{height:62px;border-bottom:1px solid #e5e8ec;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:#fff}.head .name{font-size:14px;font-weight:780}.head .badge{font-size:10px;border:1px solid #c8d5e3;padding:4px 7px;border-radius:5px;color:#54748e}.screen{padding:18px 16px 28px}.bread{font-size:12px;color:#708096;margin-bottom:14px}.bread button{background:none;border:0;padding:0;color:#396d9c;text-decoration:underline}.hero{padding:20px 18px;border-radius:12px;background:#eaf1f8;border:1px solid #d1e0ee}.hero .eyebrow{font-size:11px;color:#68829d;margin-bottom:7px}.hero h2{font-size:23px;line-height:1.32;margin:0 0 9px}.hero p{margin:0;color:#66798b;line-height:1.65;font-size:13px}.section-title{font-size:15px;font-weight:740;margin:22px 2px 12px}.module-card{width:100%;text-align:left;border:1px solid #dbe2e9;border-radius:12px;background:#fff;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:9px;align-items:center}.module-card strong{font-size:15px}.module-card small{display:block;margin-top:7px;color:#7b8795;font-size:12px}.arrow{font-size:20px;color:#7a9ab9}.subtle{color:#7f8994;font-size:12px;line-height:1.7;margin-top:9px}.callout{margin-top:18px;padding:12px;font-size:12px;line-height:1.7;color:#526d84;background:#f0f5fa;border-radius:9px}.grade-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grade-card{background:white;border:1px solid #d7e2ec;border-radius:12px;min-height:108px;text-align:left;padding:13px}.grade-card b{font-size:17px}.grade-card small{display:block;color:#788ba0;margin-top:8px}.grade-card span{display:block;color:#3975ae;font-size:11px;margin-top:11px}.grade-card:last-child{grid-column:span 2;min-height:80px}.week-list{display:grid;gap:8px}.week-card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:11px 13px;background:#fff;border:1px solid #dce4eb;border-radius:9px}.week-card .bubble{background:#f0f4f8;color:#4b6f8d;display:grid;place-items:center;width:45px;height:43px;flex-shrink:0;border-radius:7px;font-size:12px}.week-card strong{font-size:13px}.week-card small{display:block;color:#8693a0;font-size:11px;margin-top:4px}.week-card .right{margin-left:auto;color:#8e9cac}.player{min-height:185px;background:#e9eef2;border:1px dashed #99a9b7;border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px}.play-icon{width:56px;height:56px;border:2px solid #8fa4b6;border-radius:50%;display:grid;place-items:center;margin:auto auto 10px;color:#6688a6;font-size:20px}.player b{font-size:13px}.player small{display:block;color:#778896;font-size:11px;line-height:1.6;margin-top:7px}.title-pair{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.title-pair b{font-size:16px}.title-pair small{font-size:11px;color:#6d8090}.mock-control{width:100%;background:#2c6da9;border:0;color:white;border-radius:9px;padding:12px;font-size:13px;margin-bottom:4px}.lesson-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.lesson-btn{border:1px solid #dbe2e8;background:#fff;border-radius:8px;font-size:13px;min-height:49px}.lesson-btn.selected{background:#e7f1fb;border-color:#4a8fcb;color:#1b588b;font-weight:750}.linkline{display:flex;justify-content:center;gap:14px;margin-top:15px}.text-btn{background:transparent;border:none;color:#396e9c;font-size:12px;text-decoration:underline;padding:5px}.empty{text-align:center;padding:70px 12px}.empty .symbol{font-size:39px;color:#9cabb8}.empty h2{font-size:19px}.empty p{font-size:13px;line-height:1.6;color:#778796}.footer{font-size:11px;color:#9ba4ae;text-align:center;padding:15px}.device-label{font-size:11px;color:#657284;text-align:center;line-height:1.6}.hidden{display:none}@media(max-width:830px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.sidebar h2,.sidebar h3,.sidebar hr,.sidebar .note{grid-column:1/-1}.sidebar hr{margin:10px 0}.intro{display:block}.flag{display:inline-block;margin-top:12px}.stage{padding:14px;min-height:unset}.device{min-height:670px}}@media(max-width:420px){.workspace{padding:12px}.intro h1{font-size:20px}.sidebar{padding:12px}.scene{padding:9px 5px}.scene b{font-size:11px}.scene small{font-size:10px}.device{width:100%}.stage{padding:6px}.screen{padding:15px 12px 22px}}
</style>
</head>
<body>
<div class="workspace">
<header class="intro"><div><h1>校园数字教学资源中心 · V0.1 低保真原型</h1><p>阶段 1 / 第 1–2 天 · 用于审核信息架构与手机端操作流程。可以点击手机中的卡片模拟跳转。</p></div><div class="flag">仅界面草图 · 未连接视频、微信、腾讯云</div></header>
<div class="layout">
<aside class="sidebar"><h2>页面与用户流程</h2>
<button class="scene active" data-screen="home"><span class="num">P1</span><span><b>资源总站</b><small>首期仅开放书法教学</small></span></button>
<button class="scene" data-screen="calligraphy"><span class="num">P2</span><span><b>书法 · 年级选择</b><small>一年级至五年级下册</small></span></button>
<button class="scene" data-screen="weeks"><span class="num">P3</span><span><b>年级 · 周次列表</b><small>第 2–14 周，数字排序</small></span></button>
<button class="scene" data-screen="player"><span class="num">P4</span><span><b>周次 / 单课播放</b><small>共享播放器 + 课程选择</small></span></button>
<button class="scene" data-screen="error"><span class="num">P5</span><span><b>无效链接</b><small>友好空状态和返回</small></span></button>
<hr /><h3>模拟扫码直达</h3>
<button class="simulation" id="simulate-week">📖 一年级下册 · 第 2 周二维码</button>
<button class="simulation" id="simulate-lesson">🔎 一年级下册 · 第 2 周“广”字二维码</button>
<p class="note">这两个按钮只模拟扫码后应出现的页面，<b>没有生成真实二维码，也没有播放真实视频</b>。扫码印刷粒度仍需校方决定。</p>
</aside>
<main class="stage"><div class="stage-meta" id="stage-label">P1 · 资源总站首页</div>
<div class="device"><div class="phone-top"><div class="notch"></div></div><div class="viewport"><div class="head"><div class="name">校园数字教学资源中心</div><div class="badge">V0.1 草图</div></div><div class="screen" id="screen-content"></div><div class="footer">仅供方案评审 · 非实际网站</div></div></div>
<div class="device-label">建议用手机宽度审阅：是否能快速找到目标周次？<br/>进入播放页后是否还需要减少操作？</div>
</main></div></div>
<script>
const sourceTopics=['长撇','斜捺','平捺','长提','竖钩','弯钩','竖提','撇折','斜钩','卧钩','竖弯钩','横折','横折直钩'];
const lessonTitles=['长撇','人','广','少','左','在'];
let screen='home', grade=1, week=2, selected=0;
const el=document.getElementById('screen-content');
const names={home:'P1 · 资源总站首页',calligraphy:'P2 · 书法教学首页（年级列表）',weeks:'P3 · 年级页面（周次列表）',player:'P4 · 课程播放页（仅占位）',error:'P5 · 异常路径处理'};
function go(next){screen=next;render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));document.getElementById('stage-label').textContent=names[screen];
if(screen==='home')el.innerHTML=`<div class="hero"><div class="eyebrow">欢迎来到学校数字学习空间</div><h2>让学习资源<br/>触手可及</h2><p>通过教材二维码或资源目录，随时查看对应教学示范。</p></div><div class="section-title">已开放资源</div><button class="module-card" onclick="go('calligraphy')"><span><strong>✍️ 书法教学</strong><small>一年级至五年级下册 · 示范视频</small></span><span class="arrow">›</span></button><div class="callout">后续可扩展朗读、科学实验等教学资源，但尚未上线的模块不会显示成可点击入口。</div>`;
if(screen==='calligraphy')el.innerHTML=`<div class="bread"><button onclick="go('home')">总站</button> › 书法教学</div><div class="hero"><div class="eyebrow">书法教学</div><h2>选一个年级，<br/>开始练习</h2><p>首期开放一年级至五年级下册内容。</p></div><div class="section-title">选择年级</div><div class="grade-list">${[1,2,3,4,5].map(n=>`<button class="grade-card" onclick="grade=${n};go('weeks')"><b>${'一二三四五'[n-1]}年级</b><small>下册 · 第 2–14 周</small><span>查看课程 ›</span></button>`).join('')}</div>`;
if(screen==='weeks')el.innerHTML=`<div class="bread"><button onclick="go('home')">总站</button> › <button onclick="go('calligraphy')">书法</button> › ${'一二三四五'[grade-1]}年级下册</div><div class="hero"><div class="eyebrow">书法教学 · 下册</div><h2>${'一二三四五'[grade-1]}年级课程</h2><p>共 13 个教学周 · 第 2–14 周</p></div><div class="section-title">选择教学周次</div><div class="week-list">${Array.from({length:13},(_,i)=>i+2).map(w=>`<button class="week-card" onclick="week=${w};selected=0;go('player')"><span class="bubble">第 ${w} 周</span><span><strong>${grade===1?sourceTopics[w-2]:'第 '+w+'周'}</strong><small>${grade<=2?'6 个':'15 个'}视频 · 点开查看</small></span><span class="right">›</span></button>`).join('')}</div>`;
if(screen==='player')el.innerHTML=`<div class="bread"><button onclick="go('calligraphy')">书法</button> › <button onclick="go('weeks')">${'一二三四五'[grade-1]}年级下册</button> › 第 ${week} 周</div><div class="hero" style="padding:15px"><div class="eyebrow">${'一二三四五'[grade-1]}年级下册 · 第 ${week} 周</div><h2 style="font-size:19px;margin:0">${grade===1?sourceTopics[week-2]:'第 '+week+'周'}</h2></div><div class="title-pair"><b id="current-label">${grade===1&&week===2?lessonTitles[selected]:'示范视频'}</b><small>当前课程</small></div><div class="player"><div><div class="play-icon">▶</div><b>HTML5 视频区域（位置示意）</b><small>V0.1 未接入 MP4<br/>V0.3 将添加真实播放、暂停与错误提示</small></div></div><button class="mock-control" onclick="alert('当前仅为界面草图，没有视频源。真实播放功能将在 V0.3 开发。')">▶ 播放示范（交互示意）</button><div class="section-title">本周课程 · ${grade<=2?'6':'15'} 项</div><div class="lesson-list">${Array.from({length:grade<=2?6:15},(_,i)=>i).map(i=>`<button class="lesson-btn ${selected===i?'selected':''}" onclick="selected=${i};render()">${i+1}. ${grade===1&&week===2?lessonTitles[i]:'课程'+(i+1)}</button>`).join('')}</div><div class="linkline"><button class="text-btn" onclick="go('weeks')">← 返回周次列表</button><button class="text-btn" onclick="go('home')">返回总站</button></div><div class="callout">注意：单课直达会在进入本页时选定对应课程；浏览器可能要求用户点击播放按钮才能开始视频。</div>`;
if(screen==='error')el.innerHTML=`<div class="bread"><button onclick="go('home')">总站</button> › 页面不可用</div><div class="empty"><div class="symbol">⌁</div><h2>未找到对应课程</h2><p>链接可能输入有误，或该周次尚未开放。<br/>请返回已发布的书法课程目录。</p><button class="mock-control" onclick="go('calligraphy')">返回书法教学</button></div>`;
}
document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.screen)));
document.getElementById('simulate-week').addEventListener('click',()=>{grade=1;week=2;selected=0;go('player')});
document.getElementById('simulate-lesson').addEventListener('click',()=>{grade=1;week=2;selected=2;go('player')});
render();
</script>
</body>
</html>
