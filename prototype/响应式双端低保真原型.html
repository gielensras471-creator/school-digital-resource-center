 '1-2':['长撇','人','广','少','左','在'],

const numeral=g=>chars[g-1]+'年级下册';
const topic=(g,w)=>topics[g]?.[w-2]||`第 ${w} 周`;
const path=(g,w,l)=>`/calligraphy/grade/${g}`+(w?`/week/${w}`:'')+(l?`/lesson/${l}`:'');
const link=(href,label,cls='')=>`<a href="#${href}" class="${cls}">${label}</a>`;
const crumbs=(arr)=>`<nav class="breadcrumb" aria-label="面包屑">${arr.map((r,i)=>i===arr.length-1?`<span>${r[1]}</span>`:`<a href="#${r[0]}">${r[1]}</a>`).join('<span>›</span>')}</nav>`;
const main=document.getElementById('site-main');

function render(){const route=parse();const p=route.page;document.getElementById('nav-home').classList.toggle('active',p==='home');document.getElementById('nav-calligraphy').classList.toggle('active',p!=='home'&&p!=='error');
if(p==='home')main.innerHTML=`<section class="hero"><div><div class="eyebrow">WELCOME TO LEARN</div><h1>让每一次练习，<br>都有清晰的示范。</h1><p>面向学生与家长的教学资源中心。扫描教材中的二维码，或按年级、周次自行查找教学视频。</p>${link('/calligraphy','进入书法教学 <span aria-hidden="true">→</span>','primary')}</div><div class="hero-visual" aria-hidden="true"><div class="paper"><span>永</span></div><div class="chip chip-one">✦ 示范课程</div><div class="chip chip-two">▣ 教材扫码直达</div></div></section><div class="section-head"><h2>教学资源</h2><p>首期开放一个模块</p></div><div class="module-grid"><a href="#/calligraphy" class="module-card"><span class="module-icon" aria-hidden="true">书</span><span><h3>书法教学</h3><p>一年级至五年级下册 · 65 个教学周</p></span><span class="go">进入 →</span></a><div class="future"><b>更多学科资源</b><p>朗读、科学实验等未来按需接入；未开放的模块不设置虚假入口。</p></div></div>`;
else if(p==='calligraphy')main.innerHTML=`${crumbs([['/','资源总站'],['/calligraphy','书法教学']])}<div class="page-header"><div><div class="eyebrow">CALLIGRAPHY</div><h1>书法教学</h1><p>选择年级，再按教学周次查找示范课程。</p></div><span class="count-tag">5 个年级 · 65 周</span></div><div class="grade-layout"><div class="grade-grid">${[1,2,3,4,5].map(g=>`<a class="grade-card" href="#${path(g)}"><span class="grade-number">${g}</span><b>${numeral(g)}</b><small>第 2–14 周 · ${g<3?'78':'195'} 段示范视频</small><span class="grade-link">查看教学周次 →</span></a>`).join('')}</div><aside class="guide"><h3>如何使用资源？</h3><ul><li>从教材扫码，可直接打开指定周次或课程。</li><li>自主浏览时，依次选择年级和周次。</li><li>周次页可切换当前周的示范视频。</li></ul><div class="hint">V0.1 仅为原型，真实视频将在后续版本接入。</div></aside></div>`;
else if(p==='weeks'){let g=route.g;main.innerHTML=`${crumbs([['/','资源总站'],['/calligraphy','书法教学'],[path(g),numeral(g)]])}<div class="page-header"><div><div class="eyebrow">GRADE ${g} · SECOND SEMESTER</div><h1>${numeral(g)}</h1><p>第 2–14 周 · 按数字周次排列</p></div><span class="count-tag">13 个教学周</span></div><div class="week-grid">${Array.from({length:13},(_,i)=>i+2).map(w=>`<a class="week-card" href="#${path(g,w)}"><span class="week-number">第 ${w} 周</span><span><b>${topic(g,w)}</b><small>${count(g)} 个示范视频</small></span><span class="chev">›</span></a>`).join('')}</div><div class="info-banner">五年级原始素材尚无确认的每周教学主题，页面仅显示“第 N 周”；所有课程名和数量均需在批量导入时与实际文件复核。</div>`;}
else if(p==='player'){let {g,w,l}=route;let key=`${g}-${w}`;if(previousWeek!==key){currentLesson=1;previousWeek=key;}currentLesson=l===null?1:l;const items=samples[key]||Array.from({length:count(g)},(_,i)=>`课程 ${String(i+1).padStart(2,'0')}（待导入）`);let selected=items[currentLesson-1];main.innerHTML=`${crumbs([['/','资源总站'],['/calligraphy','书法教学'],[path(g),numeral(g)],[path(g,w),`第 ${w} 周`]])}<div class="player-heading"><div><div class="eyebrow">CALLIGRAPHY · WEEK ${w}</div><h1>${topic(g,w)}</h1><p>${numeral(g)} · 第 ${w} 周 · ${count(g)} 项课程</p></div><span class="path-preview">${path(g,w,l)}</span></div><div class="player-layout"><section class="video-panel"><div class="video-head"><b>${selected}</b><small>当前课程 · ${currentLesson}/${count(g)}</small></div><div class="video-placeholder"><span class="play-circle">▷</span><b>视频播放区域</b><small>V0.1 尚未接入 MP4；实际视频<br>将在 V0.3 通过 HTML5 播放器展示</small></div><div class="video-controls"><button class="primary" type="button" id="mock-video">查看播放功能计划 →</button><span class="meta">真实视频尺寸及方向待检测</span></div></section><aside class="lesson-panel"><div class="lesson-header"><b>本周课程</b><p>点击课程名称，预览切换后的页面状态</p></div><div class="lesson-grid">${items.map((name,i)=>`<a class="lesson-item ${i+1===currentLesson?'active':''}" href="#${path(g,w,i+1)}"><span>${String(i+1).padStart(2,'0')}</span><strong>${name}</strong></a>`).join('')}</div><div class="lesson-foot">显示的样本名称来自已有课程目录；其他周次仅为数据结构占位，尚未经原始视频校验。</div></aside></div><div class="back-area">${link(path(g),'← 返回周次列表','secondary')}${link('/calligraphy','返回书法首页','secondary')}</div>`;
document.getElementById('mock-video').addEventListener('click',()=>alert('V0.1 仅演示页面结构和选课操作。真实视频播放、暂停、重播和加载失败提示属于 V0.3 工作。'));}
else main.innerHTML=`${crumbs([['/','资源总站'],['','页面未找到']])}<section class="empty"><div class="empty-symbol">⌁</div><h1>未找到对应课程</h1><p>链接可能有误，或对应课程不在已知的年级、周次范围中。请返回资源中心重新选择。</p>${link('/calligraphy','返回书法教学','primary')}</section>`;
main.setAttribute('data-page',p);
}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
let frame=document.getElementById('preview-frame');const desktopBtn=document.getElementById('desktop-btn'),mobileBtn=document.getElementById('mobile-btn');
function device(phone){frame.classList.toggle('phone-preview',phone);desktopBtn.classList.toggle('active',!phone);mobileBtn.classList.toggle('active',phone);document.getElementById('preview-desc').textContent=phone?'手机布局 · 约 390px 宽，课程列表纵向排列':'电脑布局 · 自适应宽屏，内容以网格和双栏展示';}
desktopBtn.addEventListener('click',()=>device(false));mobileBtn.addEventListener('click',()=>device(true));
document.getElementById('scan-week').addEventListener('click',()=>{location.hash='#/calligraphy/grade/1/week/2';render();});
document.getElementById('scan-lesson').addEventListener('click',()=>{location.hash='#/calligraphy/grade/1/week/2/lesson/3';render();});
if(!location.hash)location.hash='#/';render();
</script>
</body>
</html>
